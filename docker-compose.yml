services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: system_a_core
      POSTGRES_USER: system_a
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system_a -d system_a_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  grm:
    build: ../grm-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      CORE_API_URL: http://core:8000
      CORE_ADMIN_KEY: ${ADMIN_API_KEY}
    volumes:
      - grm_data:/app/data
    depends_on:
      - core

  frontend:
    build: ../frontend
    restart: always
    ports:
      - "3010:3000"
    environment:
      CORE_API_URL: http://core:8000
      CORE_ADMIN_KEY: ${ADMIN_API_KEY}
      GRM_SERVICE_URL: http://grm:8001
      DATABASE_URL: postgresql://frontend:${FRONTEND_DB_PASSWORD}@frontend-db:5432/frontend_db
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost
    depends_on:
      - core
      - grm
      - frontend-db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - core
      - grm

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  frontend-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: frontend_db
      POSTGRES_USER: frontend
      POSTGRES_PASSWORD: ${FRONTEND_DB_PASSWORD}
    volumes:
      - frontend_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontend -d frontend_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  grafana_data:
  frontend_db_data:
  grm_data:
